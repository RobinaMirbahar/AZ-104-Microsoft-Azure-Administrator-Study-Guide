name: Repository & Architecture Verification CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify Web Assets, Configs & Documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Repository Structure & Documentation
        run: |
          python3 - << 'EOF'
          import pathlib, py_compile

          root = pathlib.Path(".")
          py_files = [p for p in root.rglob("*.py") if ".venv" not in p.parts and "node_modules" not in p.parts]
          for p in py_files:
              py_compile.compile(str(p), doraise=True)

          html_files = list(root.rglob("*.html"))
          readme = root / "README.md"
          assert readme.exists() and readme.stat().st_size > 50, "README.md must exist and be non-empty"
          print(f"Verified {len(py_files)} Python files, {len(html_files)} HTML files, and README.md.")
          EOF
